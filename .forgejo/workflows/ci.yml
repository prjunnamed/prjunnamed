on:
  push:
  pull_request:
  merge_group:

name: CI
jobs:
  test:
    runs-on: debian-trixie
    steps:
    - name: Check out source code
      uses: actions/checkout@v6
    - name: Set up toolchain
      uses: https://codeberg.org/prjunnamed/setup-rust-toolchain@f0e3fff1ca3442708aa9fb8156820eb859d80846
    - name: Set up Z3
      run: |
        apt-get update
        apt-get install z3
    - name: Run tests
      run: cargo test
    - name: Run tests and verify with SMT
      run: cargo test --features verify -p prjunnamed-generic

  document:
    runs-on: debian-trixie
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
      - name: Set up mdBook
        uses: https://github.com/peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.1'
      - name: Set up Rust
        uses: https://codeberg.org/prjunnamed/setup-rust-toolchain@f0e3fff1ca3442708aa9fb8156820eb859d80846
      - name: Build the book
        run: |
          mdbook build docs
      - name: Build the API docs
        run: |
          cargo doc --lib --no-deps
          cp -r target/doc docs/out/api
      - name: Upload documentation archive
        uses: forgejo/upload-artifact@v4
        with:
          name: docs
          path: docs/out

  publish:
    needs: document
    if: ${{ forge.repository == 'prjunnamed/prjunnamed' && forge.event.ref == 'refs/heads/main' }}
    runs-on: debian-trixie
    permissions:
      contents: write
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
      - name: Download documentation archive
        uses: forgejo/download-artifact@v4
        with:
          name: docs
          path: docs/out
      - name: Publish documentation
        uses: actions/git-pages@v2
        with:
          site: https://prjunnamed.org/
          password: ${{ secrets.GREBEDOC_TOKEN }}
          source: docs/out/

  cargo-deny:
    runs-on: debian-trixie
    steps:
    - uses: actions/checkout@v6
    - uses: https://github.com/EmbarkStudios/cargo-deny-action@v2
      with:
        # Must bump above the default of 1.71.0 to accept edition 2024.
        rust-version: 1.85
